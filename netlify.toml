[build]
  command = "npm install -g grunt-cli sass && npm install && pip install -r requirements.txt && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  PYTHON_VERSION = "3.11"

# Langue par défaut à la racine (évite la meta-refresh seule)
[[redirects]]
  from = "/"
  to = "/fr/"
  status = 301
  force = true
